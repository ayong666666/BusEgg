server:
  port: 8080

spring:
  application:
    name: busegg-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/busegg_site_dev?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

busegg:
  jwt:
    secret: ${JWT_SECRET:busegg-development-secret-key-change-before-production-2026}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  init-admin:
    username: ${INIT_ADMIN_USERNAME:bugegg}
    password: ${INIT_ADMIN_PASSWORD:bugegg}
    nickname: ${INIT_ADMIN_NICKNAME:初始管理员}
